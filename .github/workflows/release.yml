name: release

# Immutable artifacts (BRIEFING/08.RUNTIME/0802 step 2; M04/M08/OP-09):
# builds the four images from the exact tagged SHA, publishes them to GHCR
# with a content digest, signs each digest with Cosign keyless (OIDC) and
# records the digests as a release artifact. Deploy itself is a separate,
# human-triggered step (docs/operations/deploy.md).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  preflight:
    name: Require green quality and security on this SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify completed workflow runs for the same SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for workflow in quality.yml security.yml; do
            conclusion="$(gh api "repos/$REPO/actions/workflows/$workflow/runs?head_sha=$SHA&status=completed&per_page=5" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
            if [ "$conclusion" = "0" ]; then
              echo "::error::$workflow has no successful completed run for $SHA"
              exit 1
            fi
          done

  images:
    name: Build, publish and sign ${{ matrix.image }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: cvg-api
            dockerfile: apps/api/Dockerfile
            target: runtime
          - image: cvg-api-migrator
            dockerfile: apps/api/Dockerfile
            target: migrator
          - image: cvg-worker
            dockerfile: apps/worker/Dockerfile
            target: runtime
          - image: cvg-web
            dockerfile: apps/web/Dockerfile
            target: runtime
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify checkout SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test -n "$EXPECTED_SHA"
          test "$EXPECTED_SHA" = "$(git rev-parse HEAD)"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image digest (keyless, OIDC)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Record digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p release-images
          printf '{"image":"%s","digest":"%s","sha":"%s","ref":"%s"}\n' \
            "$IMAGE" "$DIGEST" "$GITHUB_SHA" "$GITHUB_REF_NAME" \
            > "release-images/${{ matrix.image }}.json"

      - name: Upload digest record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-images-${{ matrix.image }}
          path: release-images/
          retention-days: 90
