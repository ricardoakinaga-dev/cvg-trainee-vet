name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
          POSTGRES_DB: cvg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cvg"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.15.5
        ports:
          - 6333:6333
    env:
      NODE_ENV: test
      API_HOST: 127.0.0.1
      API_PORT: 3000
      WEB_ORIGINS: http://127.0.0.1:3100
      DATABASE_URL: postgresql://cvg_app:cvg_app_password@127.0.0.1:5432/cvg
      CVG_TEST_DATABASE_URL: postgresql://postgres:postgres_test_password@127.0.0.1:5432/cvg
      CVG_REAL_E2E_DATABASE_URL: postgresql://cvg_app:cvg_app_password@127.0.0.1:5432/cvg
      CVG_REAL_E2E_ADMIN_DATABASE_URL: postgresql://postgres:postgres_test_password@127.0.0.1:5432/cvg
      QDRANT_ENABLED: "false"
      QDRANT_URL: http://127.0.0.1:6333
      CVG_TEST_QDRANT_URL: http://127.0.0.1:6333
      AI_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Configure least-privilege app role
        env:
          PGPASSWORD: postgres_test_password
          CVG_APP_PASSWORD: cvg_app_password
        run: |
          psql --host 127.0.0.1 --username postgres --dbname cvg --set ON_ERROR_STOP=1 --set app_value="$CVG_APP_PASSWORD" <<'SQL'
          SELECT format('CREATE ROLE cvg_app LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS', :'app_value')
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'cvg_app') \gexec
          SELECT format('ALTER ROLE cvg_app LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS', :'app_value') \gexec
          GRANT CONNECT ON DATABASE cvg TO cvg_app;
          GRANT USAGE ON SCHEMA public TO cvg_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO cvg_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO cvg_app;
          SQL

      - name: Wait for Qdrant readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:6333/readyz; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "Qdrant did not become ready" >&2
          exit 1

      - name: Verify quality and boundaries
        run: pnpm verify

      - name: Apply migrations
        run: DATABASE_URL="$CVG_REAL_E2E_ADMIN_DATABASE_URL" pnpm db:migrate

      - name: Run live PostgreSQL integration tests
        run: pnpm test:integration:live

      - name: Run live Qdrant integration tests
        run: pnpm test:integration:qdrant

      - name: Verify synthetic backup and restore
        run: pnpm test:integration:restore

      - name: Build all workspaces
        run: CVG_API_INTERNAL_URL=http://127.0.0.1:3000 pnpm build

      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: pnpm test:e2e

      - name: Run browser E2E tests against real API and PostgreSQL
        run: CVG_RUN_REAL_E2E=true pnpm test:e2e

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Publish quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-artifacts-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            coverage/
            playwright-report/
            test-results/
