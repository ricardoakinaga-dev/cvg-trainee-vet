name: candidate

# Full AAA promotion pipeline (§65-66): heavy gates live here, never on the
# push workflow. Manual dispatch, scheduled load profile, or release tags.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 0"
  push:
    tags:
      - "candidate-*"

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cvg
          POSTGRES_PASSWORD: cvg_test_password
          POSTGRES_DB: cvg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvg -d cvg"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.15.5
        ports:
          - 6333:6333
    env:
      NODE_ENV: test
      API_HOST: 127.0.0.1
      API_PORT: 3000
      WEB_ORIGINS: http://127.0.0.1:3100
      CVG_MIGRATION_DATABASE_URL: postgresql://cvg:cvg_test_password@127.0.0.1:5432/cvg
      DATABASE_URL: postgresql://cvg_app:cvg_app_test_password@127.0.0.1:5432/cvg
      CVG_TEST_DATABASE_URL: postgresql://cvg_app:cvg_app_test_password@127.0.0.1:5432/cvg
      CVG_TEST_ADMIN_DATABASE_URL: postgresql://cvg_test_admin:cvg_admin_test_password@127.0.0.1:5432/cvg
      CVG_REAL_E2E_DATABASE_URL: postgresql://cvg_test_admin:cvg_admin_test_password@127.0.0.1:5432/cvg
      DIAGNOSTIC_SESSION_DRAFT_ENABLED: "false"
      QDRANT_ENABLED: "false"
      QDRANT_URL: http://127.0.0.1:6333
      CVG_TEST_QDRANT_URL: http://127.0.0.1:6333
      AI_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify checkout SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test -n "$EXPECTED_SHA"
          test "$EXPECTED_SHA" = "$(git rev-parse HEAD)"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client redis-server

      - name: Wait for Qdrant readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:6333/readyz; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "Qdrant did not become ready" >&2
          exit 1

      - name: Verify quality and boundaries
        run: pnpm verify

      - name: Verify release traceability
        run: pnpm verify:traceability:release

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://cvg:cvg_test_password@127.0.0.1:5432/cvg
        run: pnpm db:migrate

      - name: Provision least-privilege test roles
        run: node scripts/provision-ci-postgres.mjs

      - name: Run live PostgreSQL integration tests
        run: pnpm test:integration:live

      - name: Run live Qdrant integration tests
        run: pnpm test:integration:qdrant

      - name: Run full live RLS scope matrix
        run: pnpm test:rls:live

      - name: Run live Redis rate-limit matrix
        run: pnpm test:ratelimit:live

      - name: Run live Redis restart drill
        run: >
          CVG_REDIS_SERVER_BIN="$(command -v redis-server || echo /usr/bin/redis-server)"
          CVG_TEST_REDIS_URL="redis://127.0.0.1:9"
          CVG_RUN_LIVE_REDIS_TESTS="true"
          pnpm test:ratelimit:restart

      - name: Verify mutation closure (adjusted critical score)
        run: node scripts/verify-mutation-closure.mjs --write-summary

      - name: Run critical mutation discovery (Stryker report)
        run: pnpm mutation:critical

      - name: Verify expanded critical mutation closure
        run: node scripts/verify-mutation-critical.mjs --write-summary

      - name: Record test and security summaries
        run: node scripts/write-test-summary.mjs && node scripts/write-security-summary.mjs

      - name: Verify synthetic backup and restore
        run: pnpm test:integration:restore

      - name: Build all workspaces
        run: pnpm build

      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: pnpm test:e2e

      - name: Run browser E2E tests against real API and PostgreSQL
        run: CVG_RUN_REAL_E2E=true pnpm test:e2e

      - name: Verify staging-like stack (browser, drills, OTel collector)
        run: pnpm staging:verify

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Generate CycloneDX SBOM
        run: >
          npx --yes @cyclonedx/cdxgen@12.8.4 -t js
          -o sbom.cyclonedx.json --spec-version 1.6
          --fail-on-error

      - name: Record authenticated remote CI summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          node scripts/verify-same-sha.mjs
          --require-auth
          --require-candidate
          --self-candidate-run-id "${{ github.run_id }}"
          --summary-out release-evidence/remote-ci-summary.json

      - name: Record durable Redis candidate summary
        run: node scripts/write-redis-candidate-summary.mjs

      - name: Record restore summary
        env:
          CVG_RESTORE_SOURCE_DATABASE_URL: postgresql://cvg:cvg_test_password@127.0.0.1:5432/cvg
        run: node scripts/write-restore-summary.mjs

      - name: Generate release evidence bundle
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: >
          node scripts/release-evidence.mjs
          --out-dir release-evidence
          --sbom sbom.cyclonedx.json
          --coverage-summary coverage/coverage-summary.json
          --test-summary staging-evidence/test-summary.json
          --security-summary staging-evidence/security-summary.json
          --rls-live-summary staging-evidence/rls-live-summary.json
          --multi-instance-summary staging-evidence/multi-instance-summary.json
          --load-summary staging-evidence/load-summary.json
          --otel-summary staging-evidence/otel-summary.json
          --mutation-summary reports/mutation-summary.json
          --redis-candidate-summary release-evidence/redis-candidate-summary.json
          --staging-summary staging-evidence/staging-summary.json
          --restore-summary release-evidence/restore-summary.json
          --remote-ci-summary release-evidence/remote-ci-summary.json
          --ci-runs staging-evidence/ci-runs.json

      - name: Run AAA candidate promotion gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CVG_SELF_CANDIDATE_RUN_ID: ${{ github.run_id }}
        run: pnpm verify:aaa-candidate

      - name: Verify Triple AAA promotion gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CVG_SELF_CANDIDATE_RUN_ID: ${{ github.run_id }}
        run: pnpm verify:triple-aaa

      - name: Publish candidate artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-artifacts-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            coverage/
            playwright-report/
            test-results/
            ci-artifacts/
            release-evidence/
            reports/mutation-summary.json
            sbom.cyclonedx.json
