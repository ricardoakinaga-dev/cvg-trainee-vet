notes:
  - "Test IDs with * remain planned suites for later B phases; the listed B0 contract tests are implemented."
  - "This manifest contains technical IDs only; it never stores source excerpts, photos, PDFs, prompts, or participant data."
  - "F2-S2 and F3-S1 evidence use only synthetic PostgreSQL/Qdrant records and redacted metadata; participant response remains confined to the transactional answer/idempotency path."
  - "F3-S2 evidence uses synthetic PostgreSQL/Qdrant records and a deterministic fake AI; the worker stores only DRAFT_AI metadata/text for internal review and never exposes source, photo, PDF, OCR, prompt, or participant projection fields."
  - "F3-S3 evidence uses synthetic PostgreSQL records; invitation tokens are hash-only at rest, correction events omit feedback/actor data, and participant feedback is owner-scoped. Recovery beyond the administrative invitation, shared rate limit across replicas, observability, reconciliation operations, backup/restore and real AI remain gaps; CSRF and local rate limit are covered by F3-S6 and session rotation/revocation by F3-S8."
  - "F3-S4 evidence uses synthetic browser/API fixtures plus a real health browser path: participant invitation, bounded error, activity projection, start/save/submit, forbidden-field checks, authoring/operations entry surfaces, axe, keyboard/focus, retry/empty/stale and narrow viewport pass. The full participant fixture against real persistence, user testing and full learning flows remain gaps."
  - "F3-S5 evidence uses a typed allowlist logger, validated correlation IDs, in-memory counters/histograms, API route telemetry and worker outcome telemetry. It never logs payloads; external collector/OTel, retention, alerting, distributed traces and production dashboards remain gaps."
  - "F3-S6 evidence uses synthetic HTTP requests: session mutations require permitted origin/referer or same-site Fetch metadata, anonymous invitation acceptance remains allowed, local rate limiting is bounded with Retry-After, health is exempt, and rejected bodies never reach application handlers. Distributed rate limiting and real-browser/API wiring remain gaps; session rotation/revocation is covered by F3-S8."
  - "F3-S7 evidence uses synthetic published PostgreSQL records and Qdrant metadata: reconciliation embeds only server-side text, upserts deterministic ID/hash changes, removes orphan/old-version points, and returns technical counts. The non-empty PostgreSQL+Qdrant scenario is closed by WORKER-RESILIENCE-013; external observability, restore and production operation remain gaps."
  - "F3-S8 evidence uses synthetic sessions: rotation revokes the old hash and inserts the new record transactionally, revoke is uniform with an expired cookie, and no token/cookie enters public envelopes or assistive integrations. Real-browser E2E, contextual RLS and external observability remain gaps."
