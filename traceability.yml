notes:
  - "Test IDs with * remain planned suites for later B phases; the listed B0 contract tests are implemented."
  - "This manifest contains technical IDs only; it never stores source excerpts, photos, PDFs, prompts, or participant data."
  - "F2-S2 and F3-S1 evidence use only synthetic PostgreSQL/Qdrant records and redacted metadata; participant response remains confined to the transactional answer/idempotency path."
  - "F3-S2 evidence uses synthetic PostgreSQL/Qdrant records and a deterministic fake AI; the worker stores only DRAFT_AI metadata/text for internal review and never exposes source, photo, PDF, OCR, prompt, or participant projection fields."
  - "F3-S3 evidence uses synthetic PostgreSQL records; invitation tokens are hash-only at rest, correction events omit feedback/actor data, and participant feedback is owner-scoped. Recovery beyond the administrative invitation, shared rate limit across replicas, observability, reconciliation operations, backup/restore and real AI remain gaps; CSRF and local rate limit are covered by F3-S6 and session rotation/revocation by F3-S8."
  - "F3-S4 evidence uses synthetic browser/API fixtures plus a real health browser path: participant invitation, bounded error, activity projection, start/save/submit, forbidden-field checks, authoring/operations entry surfaces, axe, keyboard/focus, retry/empty/stale and narrow viewport pass. The full participant fixture against real persistence, user testing and full learning flows remain gaps."
  - "F3-S5 evidence uses a typed allowlist logger, validated correlation IDs, in-memory counters/histograms, API route telemetry and worker outcome telemetry. It never logs payloads; external collector/OTel, retention, alerting, distributed traces and production dashboards remain gaps."
  - "F3-S6 evidence uses synthetic HTTP requests: session mutations require permitted origin/referer or same-site Fetch metadata, anonymous invitation acceptance remains allowed, local rate limiting is bounded with Retry-After, health is exempt, and rejected bodies never reach application handlers. Distributed rate limiting and real-browser/API wiring remain gaps; session rotation/revocation is covered by F3-S8."
  - "F3-S7 evidence uses synthetic published PostgreSQL records and Qdrant metadata: reconciliation embeds only server-side text, upserts deterministic ID/hash changes, removes orphan/old-version points, and returns technical counts. The non-empty PostgreSQL+Qdrant scenario is closed by WORKER-RESILIENCE-013; external observability, restore and production operation remain gaps."
  - "F3-S8 evidence uses synthetic sessions: rotation revokes the old hash and inserts the new record transactionally, revoke is uniform with an expired cookie, and no token/cookie enters public envelopes or assistive integrations. Real-browser E2E, contextual RLS and external observability remain gaps."
  - "AUD-0491 item 1 documentation/governance was re-evaluated at 95/100 after DOC-GOV-001 and pnpm verify:documentation passed; the red typecheck/build gate remains an explicit gap for later items."
  - "AUD-0491 item 2 product definition was re-evaluated at 95/100 after DEF-GOV-001 and pnpm verify:product-definition passed; implementation gaps remain mapped to later score items."
  - "CURRICULUM-HOSPITAL-DESIGN-003 materializes the 24-month catalog, M02 question bank, B-07 blueprint, public choice projection, non-publishing seed and the persisted/API/web runtime integration. Clinical approval remains a human gate; the MVP remains digital-only and does not claim practical competence."
  - "CURRICULUM-RUNTIME-PREFLIGHT-004 materializes 24 internal packs and a 120-item B-07 diagnostic draft with theme profile, prerequisite path, digital mastery, directed remediation, human correction and D+7/D+30/D+90 retention. All drafts remain non-published and clinical review remains pending."
  - "CURRICULUM-RUNTIME-INTEGRATION-005 proves the digital runtime in application, PostgreSQL, contracts, API and web projection with migration 0009, 5 synthetic Playwright scenarios and 17 synthetic PostgreSQL/Qdrant live tests with 1 configuration skip; contextual RLS, real browser-to-API wiring and clinical approval remain gaps."
  - "ARCHITECTURE-BOUNDARIES-006 materializes the SPEC 0101–0103 module map as an executable policy for 12 workspace manifests and production imports; the RED/GREEN boundary test passes and the gate is included in pnpm verify."
  - "DOMAIN-CONTRACT-RULES-007 proves the item 5 domain/contract scope with strict immutable state, assessment policy, assignment/result/ticket/appeal workflows, public-boundary schemas and TDD evidence. The current verification passed with 63 files/283 tests and 9 configuration skips, coverage 85.09% statements/80.27% branches/87.56% functions/85.82% lines, 12-workspace build, 5/5 synthetic Playwright scenarios, and 14 live files/20 PostgreSQL/Qdrant tests with no skips. Persisted integration, contextual RLS, expanded API/web surfaces, clinical approval and commit closure remain gaps for later items."
  - "PERSISTENCE-INTEGRITY-008 proves item 6 for learning_assignments, assessment_workflows, feedback_tickets and appeals with migrations 0010/0011, FK/index/conditional constraints, transaction-local participant/scope context, optimistic versioning, rollback and contextual FORCE RLS. Verification passed with 64 files/289 tests and 10 configuration skips, coverage 85.23% statements/80.05% branches/87.48% functions/85.87% lines, 12-workspace build, 5/5 synthetic Playwright scenarios and 15 live files/21 PostgreSQL/Qdrant tests with no skips. The live RLS proof used a temporary role without SUPERUSER/BYPASSRLS; legacy-table RLS, production connection hardening, retention, backup/restore and API/web surfaces remain gaps for later items."
  - "API-SURFACE-009 proves item 7 for the first persisted backend slice: strict contracts, server-side capability/role/scope authorization, redacted projections, optimistic transitions and public error envelopes for assignment/workflow/ticket/appeal creation and transitions. Verification passed with 65 files/299 tests and 10 configuration skips, coverage 85.11% statements/80.15% branches/87.02% functions/85.81% lines, 12-workspace build, 5/5 synthetic Playwright scenarios and 15 live files/21 PostgreSQL/Qdrant tests with no skips. Dashboard, complete learning journey, editorial queues, paginated reads, real browser-to-API E2E, distributed idempotency, production operations and clinical publication remained gaps for later items; the minimum aggregated journey was closed separately by LEARNING-JOURNEY-011."
  - "LEARNING-JOURNEY-011 closes item 9 at 95/100 for the minimum aggregated journey: contextual assignment/activity/attempt/workflow/runtime read, next-action priority, strict public contract, GET /api/v1/learning-path, web consumption and live participant isolation. Verification passed with 70 files/323 tests and 11 configuration skips, coverage 85.01% statements/80.19% branches/86.53% functions/85.72% lines, 12-workspace build, 6/6 synthetic Playwright scenarios and the live journey/security scenario. Complete 24-month journey, dashboard, authoring/clinical approval, operational appeal, real browser-to-API E2E and restore remain gaps."
  - "AUTHORING-GOVERNANCE-012 closes item 10 at 95/100 for the technical authoring/review scope: versioned M02/24/B-07 banks, deterministic preflight, independent clinical review, publication gate, migration 0014, internal API/web projection and live workflow. Verification passed with 74 files/341 tests and 12 configuration skips, coverage 84.69% statements/80.08% branches/85.74% functions/85.38% lines, 7/7 synthetic E2E scenarios and 16 live files/22 PostgreSQL/Qdrant tests with 1 configuration skip. Clinical approval, item-by-item review/application, complete summative appeal, real browser-to-API E2E and atomic editorial transition remain gaps."
  - "AUTHORING-GOVERNANCE-012 closes item 10 at 95/100 for the technical authoring/review scope: versioned M02/24/B-07 banks, deterministic preflight, independent clinical review, publication gate, migration 0014, internal API/web projection and live workflow. Verification passed with 74 files/341 tests and 12 configuration skips, coverage 84.69% statements/80.08% branches/85.74% functions/85.38% lines, 7/7 synthetic E2E scenarios and 16 live files/22 PostgreSQL/Qdrant tests with 1 configuration skip. Clinical approval, item-by-item review/application, complete summative appeal, real browser-to-API E2E and atomic editorial transition remain gaps."
  - "WORKER-RESILIENCE-013 closes item 11 at 95/100 for worker, Qdrant, IA assistiva and recovery: seven recognized event types, non-empty PostgreSQL→Qdrant reconciliation with divergence/orphan/replay/removal, expired lease reclaim, retry and dead-letter passed using synthetic records. Verification passed with 74 coverage files/343 tests/14 skips, 84.70% statements/80.08% branches/85.76% functions/85.38% lines, 7/7 synthetic E2E scenarios and 18 live integration files/25 tests without skips. Restart observability, production providers, external telemetry, load, restore and real browser-to-API remain gaps."
  - "OBSERVABILITY-OPERATIONS-014 closes item 12 at 95/100 in the technical/documental scope: dependency health, protected Prometheus export, redaction, SLO/alert evaluation, local correlation, runbooks and synthetic PostgreSQL restore passed. The local restore recovered a synthetic marker into an isolated target with RTO 2.581 seconds. External collector/OTel, effective retention, provisioned dashboards, distributed traces, crash/failover, load and multiple replicas remain explicit operational gaps."
