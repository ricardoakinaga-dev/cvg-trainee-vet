global:
  resolve_timeout: 5m

route:
  receiver: cvg-operations
  group_by: [alertname, owner, signal]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # The local profile keeps alerts queryable inside Alertmanager. External
  # notification routing is configured only in an approved environment.
  - name: cvg-operations
