global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: cvg-api
    metrics_path: /internal/metrics/prometheus
    bearer_token_file: /run/secrets/metrics_scrape_token
    static_configs:
      - targets:
          - api-a:3000
          - api-b:3000

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889
