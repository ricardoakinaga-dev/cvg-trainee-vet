name: cvg-trainee-vet-ha

x-api-common: &api-common
  build:
    context: ../..
    dockerfile: infra/production/Dockerfile
    args:
      SOURCE_SHA: ${CVG_SOURCE_SHA:-unknown}
  image: ${CVG_APP_IMAGE:-cvg-trainee-vet:local}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  environment: &api-environment
    NODE_ENV: production
    API_HOST: 0.0.0.0
    API_PORT: "3000"
    TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?set TRUSTED_PROXY_CIDRS}
    DATABASE_URL: postgresql://${CVG_DB_USER:?set CVG_DB_USER}:${CVG_DB_APP_PASSWORD:?set CVG_DB_APP_PASSWORD}@postgres:5432/${CVG_DB_NAME:?set CVG_DB_NAME}
    WEB_ORIGINS: ${WEB_ORIGINS:?set WEB_ORIGINS}
    QDRANT_ENABLED: "false"
    AI_ENABLED: "false"
    METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:?set METRICS_SCRAPE_TOKEN}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    CVG_SOURCE_SHA: ${CVG_SOURCE_SHA:-unknown}
    IDENTITY_PROVIDER_REQUIRED: ${IDENTITY_PROVIDER_REQUIRED:-false}
    IDENTITY_PROVIDER_URL: ${IDENTITY_PROVIDER_URL:-}
    IDENTITY_PROVIDER_TOKEN: ${IDENTITY_PROVIDER_TOKEN:-}
  networks: [backend]
  healthcheck:
    test:
      [
        CMD,
        node,
        -e,
        "fetch('http://127.0.0.1:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
      ]
    interval: 10s
    timeout: 3s
    start_period: 20s
    retries: 5
  depends_on:
    migrate:
      condition: service_completed_successfully
    otel-collector:
      condition: service_started
    tempo:
      condition: service_started

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CVG_DB_ADMIN:?set CVG_DB_ADMIN}
      POSTGRES_PASSWORD: ${CVG_DB_ADMIN_PASSWORD:?set CVG_DB_ADMIN_PASSWORD}
      POSTGRES_DB: ${CVG_DB_NAME:?set CVG_DB_NAME}
      CVG_DB_USER: ${CVG_DB_USER:?set CVG_DB_USER}
      CVG_DB_APP_PASSWORD: ${CVG_DB_APP_PASSWORD:?set CVG_DB_APP_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-app-role.sh:/docker-entrypoint-initdb.d/01-init-app-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [backend]

  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [backend]

  migrate:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile
      args:
        SOURCE_SHA: ${CVG_SOURCE_SHA:-unknown}
    image: ${CVG_APP_IMAGE:-cvg-trainee-vet:local}
    restart: "no"
    command: ["pnpm", "db:migrate"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${CVG_DB_ADMIN:?set CVG_DB_ADMIN}:${CVG_DB_ADMIN_PASSWORD:?set CVG_DB_ADMIN_PASSWORD}@postgres:5432/${CVG_DB_NAME:?set CVG_DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${CVG_OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${CVG_OTEL_HTTP_PORT:-4318}:4318"
    depends_on:
      tempo:
        condition: service_started
    networks: [backend]

  tempo:
    image: grafana/tempo:3.0.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${CVG_TEMPO_PORT:-3320}:3200"
    networks: [backend]

  api-a:
    <<: *api-common

  api-b:
    <<: *api-common

  worker-a:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile
      args:
        SOURCE_SHA: ${CVG_SOURCE_SHA:-unknown}
    image: ${CVG_APP_IMAGE:-cvg-trainee-vet:local}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["node", "apps/worker/dist/main.js"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:9091/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${CVG_DB_USER:?set CVG_DB_USER}:${CVG_DB_APP_PASSWORD:?set CVG_DB_APP_PASSWORD}@postgres:5432/${CVG_DB_NAME:?set CVG_DB_NAME}
      QDRANT_ENABLED: "false"
      AI_ENABLED: "false"
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:?set METRICS_SCRAPE_TOKEN}
      WORKER_METRICS_HOST: 0.0.0.0
      WORKER_METRICS_PORT: "9091"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      CVG_SOURCE_SHA: ${CVG_SOURCE_SHA:-unknown}
    depends_on:
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      tempo:
        condition: service_started
    networks: [backend]

  worker-b:
    extends:
      service: worker-a
    command: ["node", "apps/worker/dist/main.js"]

  real-e2e-fixture:
    <<: *api-common
    profiles: [e2e]
    restart: "no"
    command: ["node", "scripts/real-e2e-fixture-server.mjs"]
    healthcheck:
      disable: true
    environment:
      <<: *api-environment
      CVG_REAL_E2E_DATABASE_URL: postgresql://${CVG_DB_USER:?set CVG_DB_USER}:${CVG_DB_APP_PASSWORD:?set CVG_DB_APP_PASSWORD}@postgres:5432/${CVG_DB_NAME:?set CVG_DB_NAME}
      CVG_REAL_E2E_ADMIN_DATABASE_URL: postgresql://${CVG_DB_ADMIN:?set CVG_DB_ADMIN}:${CVG_DB_ADMIN_PASSWORD:?set CVG_DB_ADMIN_PASSWORD}@postgres:5432/${CVG_DB_NAME:?set CVG_DB_NAME}
      CVG_REAL_E2E_FIXTURE_FILE: /tmp/cvg-real-e2e-fixture.json
      CVG_REAL_E2E_FIXTURE_HOST: 0.0.0.0
      CVG_REAL_E2E_FIXTURE_PORT: "3102"
    ports:
      - "127.0.0.1:${CVG_REAL_E2E_FIXTURE_PORT:-3102}:3102"
    depends_on: {}
    networks: [backend]

  edge:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    environment:
      CVG_PUBLIC_HTTPS_ORIGIN: ${CVG_PUBLIC_HTTPS_ORIGIN:-https://localhost:3181}
      CVG_CADDY_HTTPS_SITE: ${CVG_CADDY_HTTPS_SITE:-}
    ports:
      - "${CVG_EDGE_PORT:-8080}:${CVG_EDGE_HTTP_TARGET_PORT:-8080}"
      - "${CVG_EDGE_TLS_PORT:-3181}:${CVG_EDGE_TLS_TARGET_PORT:-8443}"
      - "127.0.0.1:${CVG_EDGE_INTERNAL_PORT:-3182}:8081"
    volumes:
      - ${CVG_CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api-a:
        condition: service_healthy
      api-b:
        condition: service_healthy
    networks: [backend]

  prometheus-secret-init:
    image: prom/prometheus:v2.55.1
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh"]
    command:
      - -ec
      - >-
        install -m 0440 -o 65534 -g 65534
        /run/secrets/metrics_scrape_token /output/metrics_scrape_token
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, FOWNER]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    secrets: [metrics_scrape_token]
    volumes:
      - prometheus-secret-data:/output

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=20GB
      - --web.enable-lifecycle
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus-data:/prometheus
      - prometheus-secret-data:/run/secrets:ro
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:9090/-/ready]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    depends_on:
      prometheus-secret-init:
        condition: service_completed_successfully
      api-a:
        condition: service_healthy
      api-b:
        condition: service_healthy
      worker-a:
        condition: service_healthy
      worker-b:
        condition: service_healthy
      otel-collector:
        condition: service_started
      alertmanager:
        condition: service_healthy
    networks: [backend]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:9093/-/ready]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    networks: [backend]

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    networks: [backend]

volumes:
  postgres-data:
  qdrant-data:
  prometheus-data:
  prometheus-secret-data:
  grafana-data:
  caddy-data:
  caddy-config:
  tempo-data:
  alertmanager-data:

secrets:
  metrics_scrape_token:
    file: ${METRICS_SCRAPE_TOKEN_FILE:?set METRICS_SCRAPE_TOKEN_FILE}

networks:
  backend:
    driver: bridge
